name: AI review example

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  review:
    # Fork PRs do not receive repository secrets. Never use pull_request_target for this job.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned review tool outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/review-tools" --ignore-scripts @ooohyg/dsh-code-review@0.2.0
      - name: Review committed changes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REVIEW_TARGET: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          REVIEW_REQUIREMENT: ${{ github.event.pull_request.title || 'Manual code review' }}
        run: |
          node "$RUNNER_TEMP/review-tools/node_modules/@ooohyg/dsh-code-review/scripts/ci-review.mjs" \
            --target "$REVIEW_TARGET" \
            --requirement "$REVIEW_REQUIREMENT" \
            --business-rules "Replace with trusted team rules" \
            --output-json "$RUNNER_TEMP/review-result/report.json" \
            --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review-report
          path: ${{ runner.temp }}/review-result/
          retention-days: 7
