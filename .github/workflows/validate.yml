name: Validate plugin

on:
  push:
    paths: ['src/**', 'tests/**', 'scripts/**', 'package*.json', 'cordis.patch.yml', 'locale/**', 'icon.svg', 'tsconfig.json', '.github/workflows/validate.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'package*.json', 'cordis.patch.yml', 'locale/**', 'icon.svg', 'tsconfig.json', '.github/workflows/validate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
